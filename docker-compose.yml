services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: beer
      POSTGRES_PASSWORD: beer
      POSTGRES_DB: beer_league
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beer -d beer_league"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: